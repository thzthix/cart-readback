name: Disabled Gemini connectivity diagnostic

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cartreadback-gemini-connectivity-one-shot
  cancel-in-progress: false

jobs:
  diagnostic-not-run:
    # A code-review change, never an input or repository setting, is required.
    # Even a scaffold dispatch could consume a future first-run enrollment.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Report the unsupported activation boundary
        run: printf '%s\n' 'NOT_RUN - production activation is unsupported'
