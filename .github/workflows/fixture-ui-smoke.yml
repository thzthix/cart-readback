name: Public fixture UI smoke (manual, render only)

on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact independently reviewed workflow commit SHA (not run approval)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-fixture-ui-smoke
  cancel-in-progress: false

jobs:
  fixture-render:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'thzthix/cart-readback' &&
      github.repository_owner == 'thzthix' &&
      github.actor_id == '95135403' &&
      github.repository_id == '1443556432' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.inputs.reviewed_head == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch only immutable hash-pinned public source and QA helpers
        shell: bash
        env:
          FETCH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError('redirect denied')

          root = Path('fixture-smoke')
          ui = root / 'ui'
          ui.mkdir(parents=True, exist_ok=False)
          head = os.environ['WORKFLOW_SHA']
          if not re.fullmatch(r'[a-f0-9]{40}', head):
              raise SystemExit('Invalid immutable workflow revision')
          source = '4f74a95c5103fddf8b7d881cd69401ad4cb86076'
          files = [
              (source, 'cart_readback/ui/viewer.html', ui / 'viewer.html', 'c1bec3b9a5c7aa58c1cbb169ff13d3f64baa9141fbe5f8123c358f04eae9b265'),
              (source, 'cart_readback/ui/viewer.mjs', ui / 'viewer.mjs', 'd65efc79097d1982f577e69a4dd9d50d5e98ef0889709fcbd89dc5c1811f1b15'),
              (source, 'cart_readback/ui/viewer-core.mjs', ui / 'viewer-core.mjs', '1be101c87184dcb831223921b97c9001877542fb000517c29b4847c8f11be5a3'),
              (source, 'cart_readback/ui/core.mjs', ui / 'core.mjs', 'be0bdf05874935f6c4d3c7c0c9e6cd510d30351364aa6e5c85440a05dd119c8a'),
              (head, 'cart_readback/ui/fixture_browser_smoke.py', root / 'fixture_browser_smoke.py', 'f489ef4938ed3378eb2f560b395c92adb3a84675d4ddd2b736cda134538841c2'),
              (head, 'cart_readback/ui/test_fixture_browser_smoke.py', root / 'test_fixture_browser_smoke.py', '927c9c3e475a1d1bc53704a0c2006a2dbb34fda54109893177a18548fe8ac900'),
          ]
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          try:
              for revision, path, destination, expected in files:
                  url = 'https://api.github.com/repos/thzthix/cart-readback/contents/' + path + '?ref=' + revision
                  req = urllib.request.Request(url, headers={
                      'Authorization': 'Bearer ' + os.environ['FETCH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
                  with opener.open(req, timeout=15) as response:
                      if response.status != 200:
                          raise ValueError('status')
                      body = response.read(262145)
                      if len(body) > 262144:
                          raise ValueError('size')
                  entry = json.loads(body)
                  if entry.get('type') != 'file' or entry.get('path') != path or entry.get('encoding') != 'base64':
                      raise ValueError('entry')
                  data = base64.b64decode(entry['content'].replace('\n', ''), validate=True)
                  if len(data) > 131072 or hashlib.sha256(data).hexdigest() != expected:
                      raise ValueError('hash')
                  destination.write_bytes(data)
          except (OSError, ValueError, KeyError, TypeError, urllib.error.URLError):
              raise SystemExit('Allowlisted source fetch failed; no raw response retained')
          print('Six allowlisted files verified; no checkout or credential persistence')
          PY
      - name: Offline checks in a fresh whitelisted environment
        shell: bash
        run: |
          cd fixture-smoke
          mkdir offline-home
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$PWD/offline-home" \
            python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName('test_fixture_browser_smoke')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = result.wasSuccessful() and result.testsRun > 0 and not result.skipped
          raise SystemExit(0 if passed else 1)
          PY
          rm -rf offline-home
      - name: Render public fixture with runner-owned Chrome and ChromeDriver
        shell: bash
        env:
          REVIEWED_SHA: ${{ github.sha }}
        run: |
          cd fixture-smoke
          mkdir harness-home
          env -i PATH=/usr/bin:/bin:/usr/local/bin LANG=C.UTF-8 \
            HOME="$PWD/harness-home" TMPDIR="$PWD/harness-home" \
            FIXTURE_HOSTED_RUN=1 FIXTURE_WORKFLOW_SHA="$REVIEWED_SHA" \
            FIXTURE_IMAGE_VERSION="$ImageVersion" python3 fixture_browser_smoke.py
      - name: Upload only public fixture PNGs and sanitized receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5, verified official commit
        with:
          name: public-fixture-render-${{ github.run_id }}
          path: |
            fixture-smoke/artifacts/review-wide.png
            fixture-smoke/artifacts/review-narrow.png
            fixture-smoke/artifacts/blocked-wide.png
            fixture-smoke/artifacts/blocked-narrow.png
            fixture-smoke/artifacts/receipt.json
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
