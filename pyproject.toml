# CartReadback development conventions; runtime imports are separate work items.
[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["D"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
